# ld65 linker config: MMC5 (iNES mapper 5), NES 2.0
# PRG 128KB = 16 x 8KB. Banks 0..12 are the switchable window at CPU $8000.
# Banks 13..15 stay mapped at $A000-$FFFF (code, music, level table, vectors).
# CHR 128KB. WRAM is the 8KB window at $6000; the cart has 8 such banks (64KB).
SYMBOLS { __STACKSIZE__: type = weak, value = $0100; }
MEMORY {
    ZP:     start = $0010, size = $00F0, type = rw;
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    RAM:    start = $0400, size = $0300, type = rw;
    WRAM:   start = $6000, size = $2000, type = rw, define = yes;
    B0:     start = $8000, size = $2000, file = %O, fill = yes;
    B1:     start = $8000, size = $2000, file = %O, fill = yes;
    B2:     start = $8000, size = $2000, file = %O, fill = yes;
    B3:     start = $8000, size = $2000, file = %O, fill = yes;
    B4:     start = $8000, size = $2000, file = %O, fill = yes;
    B5:     start = $8000, size = $2000, file = %O, fill = yes;
    B6:     start = $8000, size = $2000, file = %O, fill = yes;
    B7:     start = $8000, size = $2000, file = %O, fill = yes;
    B8:     start = $8000, size = $2000, file = %O, fill = yes;
    B9:     start = $8000, size = $2000, file = %O, fill = yes;
    B10:    start = $8000, size = $2000, file = %O, fill = yes;
    B11:    start = $8000, size = $2000, file = %O, fill = yes;
    B12:    start = $8000, size = $2000, file = %O, fill = yes;
    PRGFIX: start = $A000, size = $6000, file = %O, fill = yes, define = yes;
    CHR:    start = $0000, size = $20000, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    BANK0:    load = B0,     type = ro, optional = yes;
    BANK1:    load = B1,     type = ro, optional = yes;
    BANK2:    load = B2,     type = ro, optional = yes;
    BANK3:    load = B3,     type = ro, optional = yes;
    BANK4:    load = B4,     type = ro, optional = yes;
    BANK5:    load = B5,     type = ro, optional = yes;
    BANK6:    load = B6,     type = ro, optional = yes;
    BANK7:    load = B7,     type = ro, optional = yes;
    BANK8:    load = B8,     type = ro, optional = yes;
    BANK9:    load = B9,     type = ro, optional = yes;
    BANK10:   load = B10,    type = ro, optional = yes;
    BANK11:   load = B11,    type = ro, optional = yes;
    BANK12:   load = B12,    type = ro, optional = yes;
    STARTUP:  load = PRGFIX, type = ro, define = yes;
    CODE:     load = PRGFIX, type = ro, define = yes;
    RODATA:   load = PRGFIX, type = ro, define = yes;
    ONCE:     load = PRGFIX, type = ro, optional = yes;
    DATA:     load = PRGFIX, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
    XRAM:     load = WRAM,   type = bss, optional = yes, define = yes;
    RESET:    load = PRGFIX, type = ro, start = $FD00;
    VECTORS:  load = PRGFIX, type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
